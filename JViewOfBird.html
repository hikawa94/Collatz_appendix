<font size="3">（説明）<br>黄色で示されたセルは、パリティベクトル（PV)がそのセルで止まれば、そのPVは収束PVであることを意味し、０に到達していなければ未収束のPVであることを示します。
　０のセルを通り越して、続いているPVは、すでに収束済みのPVになります。<br>
　そのため、図の領域A（０セルの右側の領域）は、未収束PV領域、領域B（０セルの左側の領域）は、既収束PV領域ということになります。
